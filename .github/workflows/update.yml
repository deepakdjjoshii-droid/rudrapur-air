name: Update Rudrapur Air

on:
  schedule:
    - cron: "30 0 * * *"    # 06:00 IST
    - cron: "30 10 * * *"   # 16:00 IST
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # save the archive back to the repository
  pages: write
  id-token: write

concurrency:
  group: rudrapur-air
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch data, update the archive, build the page
        env:
          OPENAQ_KEY: ${{ secrets.OPENAQ_KEY }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python rudrapur_air.py

      - name: Save the archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
